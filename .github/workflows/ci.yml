name: CI (chatbot)

on:
  pull_request:
    paths:
      - "chatbot/**"
      - "tests/**"
      - "scripts/**"
      - "pytest.ini"
      - "ruff.toml"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

jobs:
  test:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: chatbot/requirements*.txt
      - run: pip install -r chatbot/requirements-dev.txt
      - run: ruff check chatbot tests scripts
      - run: ruff format --check chatbot tests scripts
      - run: python -m pytest
